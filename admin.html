<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reise – Admin</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f7fb;color:#172033;margin:0}
main{max-width:900px;margin:auto;padding:18px}
.card{background:white;border-radius:14px;padding:20px;margin:16px 0;box-shadow:0 3px 12px #0001}
input,textarea{width:100%;box-sizing:border-box;padding:10px;margin:6px 0 12px;border:1px solid #bbb;border-radius:8px}
textarea{min-height:90px}
button{padding:10px 14px;border:0;border-radius:8px;background:#173b67;color:white;cursor:pointer;margin:4px}
.activity{border:1px solid #ddd;border-radius:10px;padding:14px;margin:10px 0}
#editor{display:none}
</style>
</head>
<body>
<main>
<div class="card" id="login">
<h1>🔐 Reise-Admin</h1>
<p>Bitte Admin-Passwort eingeben.</p>
<input id="password" type="password" placeholder="Passwort">
<button onclick="login()">Anmelden</button>
<div id="loginStatus"></div>
</div>

<div id="editor">
<div class="card">
<h1>✏️ Reise bearbeiten</h1>
<label>Reisename</label><input id="title">
<label>Datum / Zeitraum</label><input id="dates">
<label>Wichtige Infos</label><textarea id="important"></textarea>
<label>Allgemeine Infos</label><textarea id="general"></textarea>
<label>Programm</label><textarea id="schedule"></textarea>
</div>

<div class="card">
<h2>🎯 Aktivitäten</h2>
<div id="activities"></div>
<button onclick="addActivity()">+ Aktivität hinzufügen</button>
</div>

<div class="card">
<button onclick="save()">💾 Änderungen speichern</button>
<button onclick="logout()">Abmelden</button>
<div id="status"></div>
</div>
</div>
</main>
<script>
const API="https://script.google.com/macros/s/AKfycbxdzIUYQh0sR_2l-xSlRcodYu70T1yZjQRDgBiduWglhiNB1nRChZk9Lf7_LsU9fPqZ/exec";
let config={activities:[]};
let sessionPassword="";

async function login(){
 const p=document.getElementById("password").value;
 if(!p){document.getElementById("loginStatus").textContent="Bitte Passwort eingeben.";return;}
 try{
  const r=await fetch(API,{method:"POST",body:JSON.stringify({action:"login",password:p})});
  const d=await r.json();
  if(d.ok){
   sessionPassword=p; sessionStorage.setItem("reiseAdminPassword",p);
   document.getElementById("login").style.display="none";
   document.getElementById("editor").style.display="block";
   loadConfig();
  }else document.getElementById("loginStatus").textContent="Falsches Passwort.";
 }catch(e){document.getElementById("loginStatus").textContent="Verbindung fehlgeschlagen.";}
}
async function loadConfig(){
 try{
  const r=await fetch(API+"?action=config"); const d=await r.json(); config=d.config||{};
  title.value=config.title||""; dates.value=config.dates||""; important.value=config.important||"";
  general.value=config.general||""; schedule.value=config.schedule||""; renderActivities();
 }catch(e){status.textContent="Daten konnten nicht geladen werden.";}
}
function renderActivities(){
 const box=document.getElementById("activities");box.innerHTML="";
 (config.activities||[]).forEach((a,i)=>{
  const d=document.createElement("div");d.className="activity";
  d.innerHTML=`<label>Name</label><input value="${esc(a.name)}" data-name="${i}">
  <label>Info</label><textarea data-info="${i}">${esc(a.info||"")}</textarea>
  <button onclick="removeActivity(${i})">🗑️ Löschen</button>`;
  box.appendChild(d);
 });
}
function addActivity(){config.activities=config.activities||[];config.activities.push({name:"Neue Aktivität",info:""});renderActivities();}
function removeActivity(i){config.activities.splice(i,1);renderActivities();}
async function save(){
 const arr=[];
 document.querySelectorAll("[data-name]").forEach((el,i)=>{
   arr.push({name:el.value,info:document.querySelector(`[data-info="${i}"]`).value});
 });
 config={title:title.value,dates:dates.value,important:important.value,general:general.value,schedule:schedule.value,activities:arr};
 try{
  const r=await fetch(API,{method:"POST",body:JSON.stringify({action:"config",password:sessionPassword,config})});
  const d=await r.json();status.textContent=d.ok?"Gespeichert!":"Speichern fehlgeschlagen.";
 }catch(e){status.textContent="Speichern fehlgeschlagen.";}
}
function logout(){sessionStorage.removeItem("reiseAdminPassword");location.reload();}
function esc(s){return String(s??"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
const saved=sessionStorage.getItem("reiseAdminPassword");
if(saved){sessionPassword=saved;document.getElementById("login").style.display="none";document.getElementById("editor").style.display="block";loadConfig();}
</script>
</body>
</html>
