<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reise</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f7fb;color:#172033}
header{background:#173b67;color:white;padding:28px 18px}
main{max-width:900px;margin:auto;padding:18px}
.card{background:white;border-radius:14px;padding:20px;margin:16px 0;box-shadow:0 3px 12px #0001}
.important{background:#fff3cd;border-left:6px solid #e0a800}
.activity{border:1px solid #ddd;border-radius:10px;padding:14px;margin:12px 0}
button{padding:10px 14px;border:0;border-radius:8px;cursor:pointer}
.choice{background:#eef2f7;margin:4px}.choice.selected{background:#173b67;color:white}
input{padding:11px;border:1px solid #bbb;border-radius:8px;width:100%;box-sizing:border-box;margin:6px 0 12px}
.small{color:#667085;font-size:.9em}
</style>
</head>
<body>
<header><h1 id="title">Reise</h1><div id="dates"></div></header>
<main>
<div id="importantCard" class="card important" style="display:none"><h2>⚠️ Wichtig</h2><div id="important"></div></div>
<div class="card"><h2>ℹ️ Allgemeine Infos</h2><div id="general"></div></div>
<div class="card"><h2>🗓️ Programm</h2><div id="schedule"></div></div>
<div class="card">
<h2>🙋 Deine Rückmeldung</h2>
<label>Name</label><input id="name" placeholder="Vor- und Nachname">
<div id="activities"></div>
<button onclick="saveVotes()">Antworten speichern</button>
<div id="status" class="small"></div>
</div>
</main>
<script>
const API="<chttps://script.google.com/macros/s/AKfycbxdzIUYQh0sR_2l-xSlRcodYu70T1yZjQRDgBiduWglhiNB1nRChZk9Lf7_LsU9fPqZ/exec";
let config={activities:[]}, answers={};

async function load(){
  try{
    const r=await fetch(API+"?action=config");
    const d=await r.json();
    config=d.config||{};
    document.title=config.title||"Reise";
    document.getElementById("title").textContent=config.title||"Reise";
    document.getElementById("dates").textContent=config.dates||"";
    document.getElementById("important").innerHTML=config.important||"";
    document.getElementById("general").innerHTML=config.general||"";
    if(config.important) document.getElementById("importantCard").style.display="block";
    document.getElementById("schedule").innerHTML=config.schedule||"Noch keine Angaben.";
    renderActivities();
  }catch(e){document.getElementById("status").textContent="Die Reisedaten konnten nicht geladen werden.";}
}
function renderActivities(){
 const box=document.getElementById("activities"); box.innerHTML="";
 (config.activities||[]).forEach((a,i)=>{
   const d=document.createElement("div"); d.className="activity";
   d.innerHTML="<b>"+escapeHtml(a.name)+"</b><div class='small'>"+escapeHtml(a.info||"")+"</div>";
   ["Ja","Nein","Vielleicht"].forEach(v=>{
     const b=document.createElement("button"); b.className="choice"; b.textContent=v;
     b.onclick=()=>{answers[i]=v; [...d.querySelectorAll("button")].forEach(x=>x.classList.remove("selected"));b.classList.add("selected");};
     d.appendChild(b);
   });
   box.appendChild(d);
 });
}
async function saveVotes(){
 const name=document.getElementById("name").value.trim();
 if(!name){document.getElementById("status").textContent="Bitte zuerst deinen Namen eintragen.";return;}
 try{
  const r=await fetch(API,{method:"POST",body:JSON.stringify({action:"vote",name,answers})});
  const d=await r.json();
  document.getElementById("status").textContent=d.ok?"Gespeichert! Danke.":"Fehler beim Speichern.";
 }catch(e){document.getElementById("status").textContent="Fehler beim Speichern.";}
}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
load();
</script>
</body>
</html>
